<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Photo Collage Gift</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="countdown-screen">
        <h2>Your Surprise Opens In...</h2>
        <div class="timer-box" id="timer">05</div>
        <button class="btn" id="open-btn" onclick="revealGift()">Click to Open Gift 🎁</button>
    </div>

    <div id="gift-screen">
        <!-- Floating Photo Frame Gallery -->
        <div class="gallery-container">
            <img src="1.jpg" class="photo photo-top-left" alt="Photo 1">
            <img src="2.jpg" class="photo photo-top-right" alt="Photo 2">
            <img src="3.jpg" class="photo photo-bottom-left" alt="Photo 3">
            <img src="4.jpg" class="photo photo-bottom-right" alt="Photo 4">
        </div>
        
        <h1>Happy Birthday, ! 🎉</h1>
        
        <p class="message">
            Wishing you a day filled with happiness and a year filled with joy! ✨
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
